{
  group:"Operate it",
  title:"Connectivity",
  tag:"private networks · on-premises · firewalls · proxies",
  intro:`Agents and runners always <b>call out</b> to the service (HTTPS 443). Connectivity questions come down to two things: can the machine reach Azure DevOps or GitHub, and can it reach the <b>targets</b> it builds against or deploys to? Hosted machines only reach what's on the public internet.`,
  sections:[
    {h:"Reaching private and on-premises targets", lang:"text", code:`Microsoft-hosted / GitHub-hosted ──public internet──▶ target must be public (or allowlist)
Self-hosted agent/runner inside the network ──▶ private targets  (only outbound 443 to the service)
Managed DevOps Pool / scale set agents in your VNet ──▶ private Azure resources, on-prem via VPN/ER
GitHub larger runners with Azure private networking ──▶ resources in your VNet
Environment VM resources / deployment groups: agent on each target, outbound only`},
    {h:"Allowlisting hosted IPs (and why to avoid it)", after:`<ul class="tips">
<li><b>Microsoft-hosted</b>: IP ranges come from the weekly Azure IP ranges file, under <code>AzureCloud.&lt;region&gt;</code>. Allow <b>every region in your organization's geography</b> and refresh the list weekly. Microsoft-hosted agents can't be described with service tags. macOS agents use GitHub's ranges instead.</li>
<li><b>GitHub-hosted</b>: ranges come from the <code>actions</code> key of <code>GET /meta</code>. They're shared and change often, and GitHub advises against allowlisting them. Use larger runners with <b>static IPs</b> or self-hosted runners.</li>
<li>Large shared ranges include other customers' machines. Prefer agents inside your network.</li>
</ul>`},
    {h:"Self-hosted agent behind a firewall or proxy", lang:"sh", code:`# outbound to: https://dev.azure.com, https://*.dev.azure.com, https://login.microsoftonline.com,
#              https://management.core.windows.net, https://download.agent.dev.azure.com, https://vssps.dev.azure.com
./config.sh --unattended --url https://dev.azure.com/contoso --auth pat --token $AZP_TOKEN --pool Default --agent agent-01 --proxyurl http://proxy.contoso.local:8080 --proxyusername svc-agent --proxypassword $PROXY_PWD
# bypass list: regexes in a .proxybypass file in the agent folder
# corporate TLS inspection: --sslcacert <ca-file>`,
     after:`<p>The agent passes proxy settings to tasks that use the task library. Tools such as <code>curl</code> or <code>dotnet</code> may also need <code>http_proxy</code> and <code>https_proxy</code> environment variables. GitHub runners read the standard <code>https_proxy</code>, <code>http_proxy</code> and <code>no_proxy</code> environment variables.</p>`}
  ],
  tip:`"Deploy to a server in a locked-down datacenter that only allows outbound traffic" → <b>self-hosted agent or environment VM resource inside the datacenter</b>. Microsoft-hosted agents can't use VPN or ExpressRoute and can't be allowlisted with service tags.`,
  exercises:[
    {id:"cn1", type:"mc", title:"Deploy into the datacenter",
     q:`A pipeline must deploy a database schema to a SQL Server in the on-premises datacenter. The datacenter allows <b>outbound</b> internet traffic only; nothing may come in from the internet. Builds stay on Microsoft-hosted agents. How do you do the deployment?`,
     options:[
       "Allowlist the Azure IP ranges for your geography on the datacenter firewall",
       "Run the deployment job on a self-hosted agent inside the datacenter; it only needs outbound HTTPS 443",
       "Connect the Microsoft-hosted agents to the datacenter over a site-to-site VPN",
       "Use the ubuntu-latest image, which supports ExpressRoute"
     ], answer:1,
     hint:`Which machine can reach the SQL Server without any inbound rule?`,
     why:`A self-hosted agent (or an environment VM resource agent) inside the datacenter can reach the SQL Server locally and only connects out to Azure DevOps over 443. Allowlisting would need inbound rules, and Microsoft-hosted agents can't use VPN or ExpressRoute at all.`},
    {id:"cn2", type:"text", lang:"sh", title:"Register through a proxy",
     q:`Register a Linux agent unattended:
      <ul class="tips">
        <li>organization <code>https://dev.azure.com/contoso</code>, PAT in <code>$AZP_TOKEN</code>, pool <code>Default</code>, agent name <code>agent-01</code></li>
        <li>all traffic goes through the proxy <code>http://proxy.contoso.local:8080</code> with user <code>svc-agent</code> and the password in <code>$PROXY_PWD</code></li>
      </ul>`,
     starter:``,
     checks:[
       {l:"config.sh --unattended with the organization URL", t:a => { const c = cmd(a, AP_CFG); return flag(c, "unattended") && flag(c, "url", /^https:\/\/dev\.azure\.com\/contoso\/?$/i); }},
       {l:"--auth pat with a --token", t:a => { const c = cmd(a, AP_CFG); return flag(c, "auth", /^pat$/i) && flag(c, "token", /\S/); }},
       {l:"--pool Default and --agent agent-01", t:a => { const c = cmd(a, AP_CFG); return flag(c, "pool", /^default$/i) && flag(c, "agent", /^agent-01$/i); }},
       {l:"--proxyurl http://proxy.contoso.local:8080", t:a => flag(cmd(a, AP_CFG), "proxyurl", /^http:\/\/proxy\.contoso\.local:8080\/?$/i)},
       {l:"--proxyusername svc-agent and --proxypassword", t:a => { const c = cmd(a, AP_CFG); return flag(c, "proxyusername", /^svc-agent$/i) && flag(c, "proxypassword", /\S/); }}
     ],
     hint:`The three proxy flags all start with <code>--proxy</code>: url, username, password.`,
     solution:`./config.sh --unattended --url https://dev.azure.com/contoso --auth pat --token $AZP_TOKEN --pool Default --agent agent-01 --proxyurl http://proxy.contoso.local:8080 --proxyusername svc-agent --proxypassword $PROXY_PWD`,
     why:`<code>--proxyurl</code>, <code>--proxyusername</code> and <code>--proxypassword</code> are stored in the agent's <code>.proxy</code> configuration (credentials encrypted). The agent uses them for its own traffic, checkout and artifact downloads, and passes them on to tasks.`},
    {id:"cn3", type:"mc", title:"Allowlisting Microsoft-hosted agents",
     q:`Your organization is in West Europe. A partner's firewall must allow your <b>Microsoft-hosted</b> agents. What's the correct (if not ideal) approach?`,
     options:[
       "Allow the AzureDevOps service tag",
       "Allow only the AzureCloud.westeurope range",
       "Ask Microsoft for the static IP address of your hosted agents",
       "Allow the AzureCloud.<region> ranges of every region in the Europe geography from the weekly file, and update them weekly"
     ], answer:3,
     hint:`Hosted agents can run in any region of your geography, and the ranges change.`,
     why:`Hosted agents can run in any region of the organization's geography, so you need the <code>AzureCloud.&lt;region&gt;</code> ranges of <b>all</b> those regions from the weekly file, kept up to date. Microsoft-hosted agents can't be described with service tags and have no static IPs. The better fix is usually a self-hosted agent or Managed DevOps Pool on a known network.`},
    {id:"cn4", type:"mc", title:"GitHub Actions into a private VNet",
     q:`GitHub Actions workflows must deploy to Azure resources that only accept traffic from a private virtual network. You want GitHub to manage the runner machines. What do you use?`,
     options:[
       "Allowlist all actions IP ranges from the meta API on the resources' firewalls",
       "macos-latest runners, because they run inside Azure",
       "GitHub-hosted larger runners with Azure private networking in your VNet",
       "Add the AzureCloud service tag to the private endpoint"
     ], answer:2,
     hint:`One GitHub-managed option puts the runner's network interface into your Azure VNet.`,
     why:`With <b>Azure private networking</b>, GitHub-hosted (larger) Linux and Windows runners get network interfaces in a subnet of your VNet, so they can reach private endpoints while GitHub still manages the VMs. Allowlisting public ranges doesn't help with resources that only accept private traffic. Self-hosted runners in the VNet would also work, but you'd manage them.`}

{
  group:"Operate it",
  title:"Maintainability",
  tag:"agent updates · images · tool installers · tool cache",
  intro:`A self-hosted fleet drifts: tools get installed by hand, agents fall behind, disks fill up. Maintainable designs treat agent images as <b>code</b>, prefer <b>disposable</b> agents, let agents <b>update themselves</b> and pin tool versions <b>in the pipeline</b>.`,
  sections:[
    {h:"Keeping agents and runners current", after:`<ul class="tips">
<li><b>Azure Pipelines agent</b>: updates itself when a task needs a newer agent version. <b>Update all agents</b> on the pool queues updates, which run after current jobs finish. A new <i>major</i> version or interactive agents may need a manual update. Azure DevOps Server can serve agent packages from a local folder.</li>
<li><b>GitHub runner</b>: updates itself by default. With <code>--disableupdate</code> you have to update it yourself, or jobs stop being assigned to it.</li>
<li><b>Elastic pools</b> (Managed DevOps Pools, scale set agents) install the current agent on every new VM.</li>
</ul>`},
    {h:"Images as code", p:`Microsoft-hosted and GitHub-hosted images are built from the open-source <b>actions/runner-images</b> repository (Packer templates and install scripts). Microsoft can't hand you the images themselves, but you can build your own:`,
     lang:"text", code:`Packer template (based on runner-images or your own) ──▶ generalized image
   ──▶ Azure Compute Gallery (versioned, replicated)
   ──▶ scale set (az vmss update … imageReference) or Managed DevOps Pool image
Managed DevOps Pools with Azure Pipelines images can pin a version:
   "wellKnownImageName": "windows-2022/20250427.1.0"`,
     after:`<p>Hosted images update about every week, and <code>-latest</code> labels move to new OS versions with announcements and brownouts. Pin explicit labels for predictable builds and test the next image early.</p>`},
    {h:"Tool installers and the tool cache", lang:"yaml", code:`steps:
- task: UseDotNet@2          # .NET SDK
  inputs:
    packageType: sdk
    version: 8.x
- task: UseNode@1            # Node.js
  inputs:
    version: 20.x
- task: UsePythonVersion@0   # Python
  inputs:
    versionSpec: '3.12'`,
     after:`<p>Downloaded tools go into the agent's <b>tool cache</b>, <code>$(Agent.ToolsDirectory)</code> (environment variable <code>AGENT_TOOLSDIRECTORY</code>). On a persistent self-hosted agent, the next job reuses them. GitHub Actions does the same with <code>actions/setup-dotnet</code>, <code>setup-node</code>, <code>setup-python</code> and <code>setup-java</code>, using <code>RUNNER_TOOL_CACHE</code>. On persistent agents, add <code>workspace: clean: all</code> to a job to start from an empty work folder.</p>`}
  ],
  tip:`"Pipelines need different tool versions" → <b>tool installer tasks / setup actions</b>, not hand-installed software. "Reduce drift and the risk of compromise" → <b>ephemeral / stateless agents</b> built from <b>versioned images</b>. "A hosted image change broke the build" → pin a specific image label; you can't roll back hosted images.`,
  exercises:[
    {id:"mt1", type:"text", lang:"yaml", title:"Pin the tool versions",
     q:`A job on a Microsoft-hosted Ubuntu agent needs the <b>.NET 8 SDK</b> and <b>Node.js 20</b>, whatever the image has preinstalled. Write the steps:
      <ul class="tips">
        <li><code>UseDotNet@2</code> installing SDK version <code>8.x</code></li>
        <li><code>UseNode@1</code> installing version <code>20.x</code></li>
        <li>then a script <code>dotnet build</code> and a script <code>npm ci</code></li>
      </ul>The installers must run <b>before</b> the scripts that use them.`,
     starter:`pool:
  vmImage: ubuntu-latest
steps:
`,
     checks:[
       {l:"Runs on a Microsoft-hosted Ubuntu image", t:a => a.h("**pool.vmImage", /^ubuntu-/i)},
       {l:"UseDotNet@2 with version 8.x", t:a => a.item("steps",{task:/^UseDotNet@2$/i,"inputs.version":/^8(\.[x\d]+)*$/i})},
       {l:"UseNode@1 with version 20.x", t:a => a.item("steps",{task:/^UseNode@1$/i,"inputs.version":/^20(\.[x\d]+)*$/i})},
       {l:"A script runs dotnet build after UseDotNet@2", t:a => { const s = a.first("steps[].script", /dotnet\s+build/); return isFinite(s) && s > a.first("steps[].task", /^UseDotNet@2$/i); }},
       {l:"A script runs npm ci after UseNode@1", t:a => { const s = a.first("steps[].script", /npm\s+ci/); return isFinite(s) && s > a.first("steps[].task", /^UseNode@1$/i); }}
     ],
     hint:`Each task is a list item <code>- task: Name@major</code> with an <code>inputs:</code> block. Put both installers at the top of <code>steps</code>.`,
     solution:`pool:
  vmImage: ubuntu-latest
steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 8.x
- task: UseNode@1
  inputs:
    version: 20.x
- script: dotnet build
- script: npm ci`,
     why:`Tool installer tasks download the requested version (or take it from the tool cache) and put it first on the PATH for the rest of the job. The pipeline then declares its own toolchain, so image updates or a different agent can't silently change the build.`},
    {id:"mt2", type:"mc", title:"windows-latest moved",
     q:`Microsoft moved <code>windows-latest</code> to a newer image and your build broke because a preinstalled tool changed. You want predictable builds and controlled upgrades. What do you do?`,
     options:[
       "Roll the Azure Pipelines pool back to the previous image version",
       "Pin vmImage to an explicit label (e.g. windows-2022) and test the new image in a separate run before switching",
       "Open a support ticket to keep the old image for your organization",
       "Switch to windows-2019, which no longer changes"
     ], answer:1,
     hint:`Hosted images can't be rolled back, and one of these images is retired.`,
     why:`<code>-latest</code> labels move on purpose. Pinning an explicit label gives you a stable target, and a separate run on the new image lets you upgrade when you're ready. Hosted images can't be rolled back, and <code>windows-2019</code> was retired at the end of 2025.`},
    {id:"mt3", type:"multi", title:"A maintainable self-hosted fleet",
     q:`Which practices make a self-hosted agent fleet easier to maintain? <i>Select all that apply.</i>`,
     options:[
       "Build agent images as code (for example Packer templates based on actions/runner-images) and publish them to Azure Compute Gallery",
       "Use stateless or ephemeral agents so that every job starts from the known image",
       "Let agents update themselves, and use Update all agents when a new major version is released",
       "RDP into each agent to install tools by hand whenever a pipeline needs one",
       "Disable agent updates permanently to avoid surprises",
       "Use tool installer tasks or setup actions to pin tool versions in each pipeline"
     ], answer:[0,1,2,5],
     hint:`Look for repeatable and automated. Rule out manual and frozen.`,
     why:`Versioned images, disposable agents, automatic agent updates and pipeline-declared tool versions all remove drift. Hand-installed tools can't be reproduced, and frozen agents fall out of support. (GitHub, for example, stops assigning jobs to runners that are too old.)`},
    {id:"mt4", type:"lines", title:"Fix the runbook", prose:true,
     q:`Click the <b>two</b> statements in this agent-operations runbook that are wrong.`,
     code:[
       "Self-hosted agents update themselves when a task needs a newer agent version.",
       "After we install new software on an agent, its capability shows up immediately; no restart is needed.",
       "Tool installer tasks such as UseNode@1 put downloaded tools in the agent tool cache, $(Agent.ToolsDirectory).",
       "If a Microsoft-hosted image update breaks a build, we roll the pool back to last week's image.",
       "Our scale set image is rebuilt monthly from Packer templates, and the scale set is then updated to the new image.",
       "Jobs that run on our persistent self-hosted agents set workspace: clean: all."
     ], answer:[1,3],
     hint:`One is about when capabilities are read; the other is about what you control on hosted agents.`,
     why:`Capabilities are collected when the agent <b>starts</b>, so restart it after installing software. Microsoft-hosted images can't be rolled back; pin an explicit image label instead. The other statements describe good practice.`}
  ]
},

{
  group:"Integrate & combine",
  title:"GitHub repositories in Azure Pipelines",
  tag:"GitHub App · service connections · PR validation · status checks · forks",
  intro:`Azure Pipelines can build any GitHub repository. The design decisions are how it <b>authenticates</b> to GitHub, how <b>pull request validation</b> reports back, and how you keep <b>fork</b> pull requests from stealing secrets.`,
  sections:[
    {h:"Authentication options", after:`<div class="tablewrap"><table class="ref">
<tr><th>Type</th><th>Runs as</th><th>GitHub Checks</th><th>Notes</th></tr>
<tr><td><b>Azure Pipelines GitHub App</b> (recommended)</td><td>Azure Pipelines identity</td><td>Yes</td><td>Installed on the account or organization for selected repositories. Posts check runs per run and per job, with test and coverage details.</td></tr>
<tr><td><b>OAuth</b></td><td>Your personal GitHub identity</td><td>No (basic statuses)</td><td>Simplest for repositories in a personal account; stops working if your access ends</td></tr>
<tr><td><b>Personal access token</b></td><td>Your personal GitHub identity</td><td>No (basic statuses)</td><td>Like OAuth, but you choose the scopes</td></tr>
</table></div>
<p>OAuth and PAT connections are stored as <b>GitHub service connections</b>. GitHub users aren't mapped to Azure DevOps users automatically, so add them to the organization if they need access to pipelines.</p>`},
    {h:"Triggers for a GitHub repository", lang:"yaml", code:`trigger:              # CI on pushes
  branches:
    include: [main, release/*]
pr:                   # PR validation (if omitted: every PR, all target branches)
  branches:
    include: [main]   # 'pr: none' turns PR validation off`},
    {h:"Make it a required check", after:`<ol class="tips">
<li>Run the pipeline once so GitHub knows its check name.</li>
<li>In GitHub, add a branch protection rule or ruleset on <code>main</code> and choose the pipeline under <b>required status checks</b>.</li>
<li>Pull requests can't merge until the pipeline's check passes. With the GitHub App, people can re-run failed checks from GitHub.</li>
</ol>`},
    {h:"Pull requests from forks", after:`<ul class="tips">
<li><b>Build pull requests from forks of this repository</b>: on by default.</li>
<li><b>Make secrets available to builds of forks</b>: <b>off</b> by default. Secrets include the GitHub token, service connections, secure files and secret variables.</li>
<li><b>Make fork builds have the same permissions as regular builds</b>: off by default. Fork builds get a restricted token.</li>
<li><b>Require a team member's comment before building a pull request</b>: on all PRs, or only on PRs from non-team members. A collaborator with write access then comments <code>/AzurePipelines run</code> (or <code>/azp run [pipeline-name]</code>).</li>
<li>At organization or project level, <b>Securely build pull requests from forked repositories</b> enforces this for every pipeline.</li>
</ul>`}
  ],
  tip:`"Show test and coverage results in GitHub" or "don't depend on one person's account" → <b>GitHub App</b>. "Block merges until the pipeline passes" → required status check in GitHub branch protection. "Public repo, PRs from forks" → keep secrets off for fork builds, require a team member's comment, and avoid self-hosted agents.`,
  exercises:[
    {id:"gh1", type:"match", title:"Which connection type?",
     q:`Match each statement to the GitHub authentication type it describes.`,
     choices:["GitHub App","OAuth","Personal access token"],
     rows:[
       ["Recommended; builds run under the Azure Pipelines identity","GitHub App"],
       ["Posts GitHub Checks with test and code coverage details","GitHub App"],
       ["Simplest for a repository in your personal account; status updates as your own identity","OAuth"],
       ["Like OAuth, but you choose exactly which scopes Azure Pipelines gets","Personal access token"],

/* ===================================================================
   MINI YAML PARSER (same as the Pipelines lab)
   Turns YAML into a flat list of { path, value } entries, e.g.
     body[0].type = textarea
   =================================================================== */
const toStr = t => t.reduce((s, x) => x[0] === "[" ? s + x : (s ? s + "." + x : x), "");

function cleanVal(v){
  v = (v || "").trim();
  if (v[0] === "'"){ const m = v.match(/^'((?:[^']|'')*)'/); if (m) return m[1].replace(/''/g, "'"); }
  if (v[0] === '"'){ const m = v.match(/^"((?:[^"\\]|\\.)*)"/); if (m) return m[1]; }
  const ci = v.search(/(^|\s)#/);
  return (ci >= 0 ? v.slice(0, ci) : v).trim();
}

function splitFlow(inner){
  const out = []; let cur = "", depth = 0, q = null;
  for (const ch of inner){
    if (q){ cur += ch; if (ch === q) q = null; continue; }
    if (ch === "'" || ch === '"'){ q = ch; cur += ch; continue; }
    if ("[{(".includes(ch)) depth++;
    if ("]})".includes(ch)) depth--;
    if (ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseYaml(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const entries = [], errors = [];
  const root = {col:-1, gt:[], it:[], kids:null};
  const stack = [root], counters = new Map();
  const top = () => stack[stack.length - 1];
  const add = (gt, it, value, line) => entries.push({gt, it, gen:toStr(gt), idx:toStr(it), value, line});
  let flagged = -1;
  const sibling = (parent, col, ln, kind) => {
    if (parent.kind && parent.kind !== kind && flagged !== ln){
      flagged = ln;
      errors.push(`Line ${ln}: this ${kind === "list" ? "list item" : "key"} sits at the same level as ${kind === "list" ? "keys" : "\"- \" list items"} under the same parent. Check the indentation.`);
    }
    parent.kind = parent.kind || kind;
    if (parent.kids === null) parent.kids = col;
    else if (parent.kids !== col && flagged !== ln)
      errors.push(`Line ${ln}: indented ${col} spaces, but its siblings use ${parent.kids}. Items at the same level must line up exactly.`);
  };
  let lastScalar = null;

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i], ln = i + 1;
    if (!raw.trim() || /^\s*#/.test(raw)) continue;
    if (/^ *\t/.test(raw)){ errors.push(`Line ${ln}: a tab is used for indentation. YAML only allows spaces.`); continue; }
    const lineCol = raw.match(/^ */)[0].length;
    let col = lineCol, rest = raw.slice(col).replace(/\s+$/, "");
    if (lastScalar && col > lastScalar.col && (flagged = ln))
      errors.push(`Line ${ln}: indented under "${lastScalar.key}" (line ${lastScalar.ln}), but that key already has a value on its own line.`);
    lastScalar = null;

    let dashNode = null;
    while (/^-(\s|$)/.test(rest)){
      while (stack.length > 1 && (top().col > col || (top().dash && top().col === col))) stack.pop();
      const parent = top();
      sibling(parent, col, ln, "list");
      const n = counters.get(parent) ?? 0; counters.set(parent, n + 1);
      dashNode = {col, gt:[...parent.gt, "[]"], it:[...parent.it, `[${n}]`], kids:null, dash:true};
      stack.push(dashNode);
      const m = rest.match(/^-\s*/)[0].length;
      col += m; rest = rest.slice(m);
    }
    if (!rest) continue;

    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)\s*:(?:\s+(.*))?$/);
    if (!km){
      if (dashNode) add(dashNode.gt, dashNode.it, cleanVal(rest), ln);
      else errors.push(`Line ${ln}: "${rest.slice(0, 40)}" is not a "key: value" pair or a "- item". Check for a missing colon or a missing space after it.`);
      continue;
    }

    const key = cleanVal(km[1]) || km[1];
    while (stack.length > 1 && top().col >= col) stack.pop();
    const parent = top();
    sibling(parent, col, ln, "map");
    const gt = [...parent.gt, key], it = [...parent.it, key];
    const rawVal = (km[2] || "").trim();

    if (/^[|>][-+]?\d*\s*(#.*)?$/.test(rawVal)){
      const body = []; let j = i + 1;
      for (; j < lines.length; j++){
        const l = lines[j];
        if (!l.trim()){ body.push(""); continue; }
        if (l.match(/^ */)[0].length > lineCol) body.push(l); else break;
      }
      while (body.length && !body[body.length - 1].trim()) body.pop();
      const ind = body.filter(x => x.trim()).map(x => x.match(/^ */)[0].length);
      const min = ind.length ? Math.min(...ind) : 0;
      if (!body.length) errors.push(`Line ${ln}: "${key}: ${rawVal}" starts a multi-line block, but no indented lines follow.`);
      add(gt, it, body.map(x => x.slice(min)).join("\n"), ln);
      i = j - 1;
      continue;
    }

    const quoted = /^['"]/.test(rawVal);
    const v = cleanVal(rawVal);
    if (v === "" && !quoted){
      stack.push({col, gt, it, kids:null});
      add(gt, it, "", ln);
    } else if (!quoted && /^\[.*\]$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach((x, k) => add([...gt, "[]"], [...it, `[${k}]`], cleanVal(x), ln));
      lastScalar = {col, key, ln};
    } else if (!quoted && /^\{.*\}$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach(pair => {
        const pm = pair.match(/^(.+?)\s*:\s*(.*)$/);
        if (pm) add([...gt, cleanVal(pm[1])], [...it, cleanVal(pm[1])], cleanVal(pm[2]), ln);
      });
      lastScalar = {col, key, ln};
    } else {
      add(gt, it, v, ln);
      lastScalar = {col, key, ln};
    }
  }
  return {entries, errors};
}

function globRe(p){
  if (p instanceof RegExp) return p;
  return new RegExp("^" + p.split(/(\*\*|\*|\[\]\?)/).map(s =>
    s === "**" ? ".*" :
    s === "*" ? "[^.\\[\\]]*" :
    s === "[]?" ? "(\\[\\])?" :
    s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$", "i");
}
const valMatch = (v, w) => w === undefined ? true : w instanceof RegExp ? w.test(v) : String(v).toLowerCase() === String(w).toLowerCase();

function makeApi(entries, src){
  const find = (p, w) => { const re = globRe(p); return entries.filter(e => re.test(e.gen) && valMatch(e.value, w)); };
  return {
    src,
    h: (p, w) => find(p, w).length > 0,
    count: (p, w) => find(p, w).length,
    first: (p, w) => Math.min(Infinity, ...find(p, w).map(e => e.line)),
    item(listPath, conds){
      const re = globRe(listPath + "[]"), groups = new Map();
      for (const e of entries){
        for (let n = 1; n <= e.gt.length; n++){
          if (e.gt[n - 1] !== "[]" || !re.test(toStr(e.gt.slice(0, n)))) continue;
          const k = toStr(e.it.slice(0, n));
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push({rel:toStr(e.gt.slice(n)), value:e.value});
        }
      }
      return [...groups.values()].some(list =>
        Object.entries(conds).every(([rp, w]) => { const r = globRe(rp); return list.some(x => r.test(x.rel) && valMatch(x.value, w)); }));
    }
  };
}

/* ===================================================================
   CHECKING (pure functions, no DOM: also used by the self-test)
   =================================================================== */
const norm = s => String(s).trim().replace(/\s+/g, " ").toLowerCase();
const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();

// Returns {ok, results:[{l, ok, sub?}], marks}  (marks drive per-item coloring)
function grade(ex, ans){
  switch (ex.type){
    case "mc": {
      const ok = ans === ex.answer;
      return {ok, results:[{l: ans === null || ans === undefined ? "Pick an answer first." : ok ? "Correct!" : "Not quite. Read the hint and try again.", ok}]};
    }
    case "multi": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = [];
      if (ok) r.push({l:"Correct! You found exactly the right options.", ok:true});
      else {
        r.push({l: missing ? `${missing} correct option${missing > 1 ? "s" : ""} not selected` : "All correct options selected", ok: !missing});
        r.push({l: extra ? `${extra} selected option${extra > 1 ? "s are" : " is"} wrong` : "No wrong options selected", ok: !extra});
      }
      return {ok, results:r};
    }
    case "order": {
      const seq = ans || [];
      const marks = seq.map((it, pos) => it === pos);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.items.length;
      return {ok, marks, results:[{l: ok ? "Correct order!" : `${right}/${ex.items.length} items are in the right position.`, ok}]};
    }
    case "match": {
      const sel = ans || [];
      const marks = ex.rows.map((r, i) => sel[i] === r[1]);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.rows.length;
      return {ok, marks, results:[{l: ok ? "All matches correct!" : `${right}/${ex.rows.length} matches correct.`, ok}]};
    }
    case "fill": {
      const vals = ans || [];
      const marks = ex.blanks.map((acc, i) => acc.some(a => norm(a) === norm(vals[i] || "")));
      const right = marks.filter(Boolean).length;
      const ok = right === ex.blanks.length;
      return {ok, marks, results:[{l: ok ? "All blanks correct!" : `${right}/${ex.blanks.length} blanks correct.`, ok}]};
    }
    case "lines": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = ok ? [{l:"Correct! You spotted exactly the right lines.", ok:true}] : [
        {l: missing ? `${missing} line${missing > 1 ? "s" : ""} still to find` : "You found every faulty line", ok: !missing},
        {l: extra ? `${extra} selected line${extra > 1 ? "s are" : " is"} actually fine` : "No correct lines selected by mistake", ok: !extra}];
      return {ok, results:r};
    }
    case "text": {
      const text = String(ans || "").replace(/\r/g, "");
      const results = [];
      let api;
      if (ex.lang === "yaml"){
        const p = parseYaml(text);
        results.push({l:"Valid YAML structure: spaces only, aligned siblings, key: value pairs", ok: p.errors.length === 0 && p.entries.length > 0, sub:p.errors});
        api = makeApi(p.entries, text.replace(/^\s*#.*$/gm, ""));
      } else {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
        api = {src:text, lines};
      }
      for (const c of ex.checks){
        let ok = false;
        try { ok = !!c.t(api); } catch (e) { ok = false; }
        results.push({l:c.l, ok});
      }
      return {ok: results.every(r => r.ok), results};
    }
  }
  return {ok:false, results:[]};
}

// The model answer for each exercise, in the same shape grade() expects.
function modelAnswer(ex){
  switch (ex.type){
    case "mc": return ex.answer;
    case "multi": case "lines": return ex.answer.slice();
    case "order": return ex.items.map((_, i) => i);
    case "match": return ex.rows.map(r => r[1]);
    case "fill": return ex.blanks.map(b => b[0]);
    case "text": return ex.solution;
  }
}

// Deterministic shuffle so the starting order is stable between visits.
function scramble(id, n){
  let seed = 0; for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.reverse();
  return a;
}

const ALL_EX = MODULES.flatMap(m => m.exercises);

/* ===================================================================
   HIGHLIGHTER (tiny, dependency-free)
   =================================================================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function commentAt(v){
  let q = null;
  for (let i = 0; i < v.length; i++){
    const ch = v[i];
    if (q){ if (ch === q) q = null; continue; }
    if ((ch === "'" || ch === '"') && (i === 0 || /\s/.test(v[i - 1]))){ q = ch; continue; }
    if (ch === "#" && (i === 0 || /\s/.test(v[i - 1]))) return i;
  }
  return -1;
}
function hlValue(v){
  const ci = commentAt(v);
  const body = ci >= 0 ? v.slice(0, ci) : v, comment = ci >= 0 ? v.slice(ci) : "";
  const t = body.trim();
  let out;
  if (/^(['"]).*\1$/.test(t)) out = `<span class="ts">${esc(body)}</span>`;
  else if (/^[|>][-+]?\d*$/.test(t)) out = `<span class="tk">${esc(body)}</span>`;
  else if (/^(true|false|none|null|~|-?\d+(\.\d+)?)$/i.test(t)) out = `<span class="tn">${esc(body)}</span>`;
  else out = esc(body);
  return out + (comment ? `<span class="tc">${esc(comment)}</span>` : "");
}
function hlYaml(code){
  let blockCol = -1;
  return code.split("\n").map(line => {
    const ind = line.match(/^ */)[0].length;
    if (blockCol >= 0){
      if (!line.trim() || ind > blockCol) return esc(line);
      blockCol = -1;
    }
    const [, sp, dash, rest] = line.match(/^(\s*)((?:-\s+|-$)*)(.*)$/);
    if (rest.startsWith("#")) return esc(sp + dash) + `<span class="tc">${esc(rest)}</span>`;
    let out = esc(sp) + (dash ? `<span class="tdash">${esc(dash)}</span>` : "");
    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)(\s*:)(\s+.*)?$/);
    if (km){
      out += `<span class="tk">${esc(km[1])}</span>${esc(km[2])}`;
      if (km[3]){
        const lead = km[3].match(/^\s*/)[0], val = km[3].slice(lead.length);
        out += lead + hlValue(val);
        if (/^[|>][-+]?\d*\s*(#.*)?$/.test(val.trim())) blockCol = ind;
      }
    } else out += hlValue(rest);
    return out;
  }).join("\n");
}
function hlSh(code){
  return code.split("\n").map(line => {
    const m = line.match(/^(\s*)(#.*)$/);
    if (m) return esc(m[1]) + `<span class="tc">${esc(m[2])}</span>`;
    const ci = line.search(/\s#\s/);
    const body = ci >= 0 ? line.slice(0, ci) : line, c = ci >= 0 ? line.slice(ci) : "";
    return esc(body).replace(/^(\s*)((?:sudo\s+)?[\w.\/\\-]+)/, '$1<span class="tk">$2</span>').replace(/(\s)(--?[\w-]+)/g, '$1<span class="tt">$2</span>')
      + (c ? `<span class="tc">${esc(c)}</span>` : "");
  }).join("\n");
}
function hlText(code){
  // highlight AB#123, #123, @mentions and trailing comments in plain text blocks
  return code.split("\n").map(line => {
    const ci = line.search(/\s{2,}(?=\S)/);
    const body = ci >= 0 ? line.slice(0, ci) : line, rest = ci >= 0 ? line.slice(ci) : "";
    const h = s => esc(s).replace(/(AB#\d+|(?:^|(?<=\s))[!#]\d+|@[\w-]+(?:\/[\w-]+)?)/g, '<span class="td">$1</span>');
    return h(body) + (rest ? `<span class="tc">${esc(rest)}</span>` : "");
  }).join("\n");
}
function highlight(code, lang){
  if (lang === "text") return hlText(code);
  if (lang === "sh") return hlSh(code);
  return hlYaml(code);
}
function codeBlock(code, lang){
  return `<div class="codewrap"><pre><code>${highlight(code, lang || "yaml")}</code></pre><button class="copy">Copy</button></div>`;
}

/* ===================================================================
   UI
   =================================================================== */
const KIND = {mc:"Single choice", multi:"Select all that apply", order:"Put in order", match:"Match", fill:"Fill in the blanks", lines:"Spot the error", text:"Write it"};

function startApp(){
  const store = {
    get(k, d){ try { const v = localStorage.getItem("agentsLab:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem("agentsLab:" + k, JSON.stringify(v)); } catch {} }
  };
  let done = store.get("done", []).filter(id => ALL_EX.some(e => e.id === id));
  let current = Math.min(store.get("current", 0), MODULES.length - 1);
  const $ = s => document.querySelector(s);
  const state = {};   // exercise id → current answer
  const modDone = m => m.exercises.filter(e => done.includes(e.id)).length;

  function renderNav(){
    let html = "", lastGroup = "";
    MODULES.forEach((m, i) => {
      if (m.group !== lastGroup){ html += `<div class="group">${m.group}</div>`; lastGroup = m.group; }
      const n = modDone(m), all = n === m.exercises.length;
      const cls = [i === current ? "active" : "", all ? "done" : ""].join(" ");
      html += `<button class="${cls}" data-i="${i}"><span class="num">${all ? "✓" : i + 1}</span>${m.title}<span class="cnt">${n}/${m.exercises.length}</span></button>`;
    });
    $("#nav").innerHTML = html;
    $("#bar").style.width = (done.length / ALL_EX.length * 100) + "%";
    $("#ptext").textContent = `${done.length} of ${ALL_EX.length} exercises completed`;
  }

  /* ---------- per-type input rendering ---------- */
  function bodyHtml(ex){
    const sid = ex.id;
    switch (ex.type){
      case "mc": case "multi":
        return `<div class="opts">${ex.options.map((o, i) =>
          `<label class="opt" data-i="${i}"><input type="${ex.type === "mc" ? "radio" : "checkbox"}" name="${sid}" value="${i}"><span>${o}</span></label>`).join("")}</div>`;
      case "order":
        return `<ol class="order" id="ol-${sid}"></ol>`;
      case "match":
        return `<table class="match">${ex.rows.map((r, i) =>
          `<tr data-i="${i}"><td>${r[0]}</td><td><select aria-label="Answer ${i + 1}"><option value="">— choose —</option>${ex.choices.map(c => `<option>${esc(c)}</option>`).join("")}</select></td></tr>`).join("")}</table>`;
      case "fill": {
        let k = 0;
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => {
          const w = Math.max(6, ...ex.blanks[+n].map(b => b.length)) + 2;
          k++; return `<input data-b="${n}" size="${w}" aria-label="Blank ${+n + 1}" autocomplete="off" spellcheck="false">`;
        });
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines":
        return `<div class="lines${ex.prose ? " prose" : ""}">${ex.code.map((l, i) =>
          `<div class="ln" data-i="${i}" role="button" tabindex="0"><span class="no">${i + 1}</span><span>${esc(l) || " "}</span></div>`).join("")}</div>`;
      case "text":
        return `<textarea class="${ex.lang === "yaml" ? "" : "short"}" spellcheck="false" aria-label="Answer editor"></textarea>
          <p class="edhelp">${ex.lang === "yaml" ? "Tab / Shift+Tab indent by 2 spaces · Enter keeps the indentation · " : ""}Ctrl+Enter checks your answer · your draft is saved automatically</p>`;
    }
  }

  function solutionHtml(ex){
    switch (ex.type){
      case "mc": return `<p><b>Answer:</b> ${ex.options[ex.answer]}</p>`;
      case "multi": return `<ul class="tips">${ex.answer.map(i => `<li>${ex.options[i]}</li>`).join("")}</ul>`;
      case "order": return `<ol class="tips">${ex.items.map(t => `<li>${t}</li>`).join("")}</ol>`;
      case "match": return `<div class="tablewrap"><table class="ref">${ex.rows.map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table></div>`;
      case "fill": {
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => `<b><u>${esc(ex.blanks[+n][0])}</u></b>`);
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines": return `<p>Faulty line${ex.answer.length > 1 ? "s" : ""}: ${ex.answer.map(i => `<b>${i + 1}</b>`).join(", ")}</p>`;
      case "text": return codeBlock(ex.solution, ex.lang === "yaml" ? "yaml" : ex.lang === "sh" ? "sh" : "text");
    }
  }

  function wireExercise(ex, root){
    const id = ex.id;
    const q = s => root.querySelector(s);
    const draftKey = "draft:" + id;

    if (ex.type === "mc"){
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => { state[id] = +inp.value; clearMarks(); });
      state[id] = null;
    }
    if (ex.type === "multi"){
      state[id] = [];
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        state[id] = [...root.querySelectorAll("input:checked")].map(x => +x.value); clearMarks();
      });
    }
    if (ex.type === "order"){
      state[id] = scramble(id, ex.items.length);
      const ol = q(".order");
      let dragFrom = null;
      const draw = (marks) => {
        ol.innerHTML = state[id].map((it, pos) =>
          `<li draggable="true" data-pos="${pos}" class="${marks ? (marks[pos] ? "right" : "wrong") : ""}"><span class="pos">${pos + 1}</span><span class="txt">${ex.items[it]}</span>
            <span class="mv"><button class="btn small" data-mv="-1" ${pos === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="btn small" data-mv="1" ${pos === ex.items.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button></span></li>`).join("");
      };
      const move = (from, to) => {
        const a = state[id]; const [x] = a.splice(from, 1); a.splice(to, 0, x); draw();
      };
      ol.onclick = e => {
        const b = e.target.closest("button[data-mv]"); if (!b) return;
        const pos = +b.closest("li").dataset.pos, to = pos + +b.dataset.mv;
        if (to >= 0 && to < ex.items.length) move(pos, to);
      };
      ol.addEventListener("dragstart", e => { const li = e.target.closest("li"); if (li){ dragFrom = +li.dataset.pos; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", ""); } catch {} } });
      ol.addEventListener("dragover", e => { if (dragFrom !== null) e.preventDefault(); });
      ol.addEventListener("drop", e => { e.preventDefault(); const li = e.target.closest("li"); if (li && dragFrom !== null) move(dragFrom, +li.dataset.pos); dragFrom = null; });
      ol.addEventListener("dragend", () => { dragFrom = null; });
      root._draw = draw;
      draw();
    }
    if (ex.type === "match"){
      state[id] = ex.rows.map(() => "");
      root.querySelectorAll("select").forEach((s, i) => s.onchange = () => { state[id][i] = s.value; s.closest("tr").className = ""; });
    }
    if (ex.type === "fill"){
      state[id] = ex.blanks.map(() => "");
      root.querySelectorAll(".fill input").forEach(inp => {
        inp.oninput = () => { state[id][+inp.dataset.b] = inp.value; inp.className = ""; };
        inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); check(); } };
      });
    }
    if (ex.type === "lines"){
      state[id] = [];
      const toggle = el => {
        const i = +el.dataset.i, a = state[id];
        if (a.includes(i)) a.splice(a.indexOf(i), 1); else a.push(i);
        root.querySelectorAll(".ln").forEach(l => l.className = "ln" + (a.includes(+l.dataset.i) ? " sel" : ""));
      };
      root.querySelectorAll(".ln").forEach(el => {
        el.onclick = () => toggle(el);
        el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(el); } };
      });
    }
    if (ex.type === "text"){
      const ed = q("textarea");
      const saved = store.get(draftKey, null);
      ed.value = saved !== null ? saved : ex.starter;
      state[id] = ed.value;
      const save = () => { state[id] = ed.value; store.set(draftKey, ed.value); };
      const insert = t => {
        ed.focus();
        if (!document.execCommand || !document.execCommand("insertText", false, t)){
          const s = ed.selectionStart, en = ed.selectionEnd;
          ed.value = ed.value.slice(0, s) + t + ed.value.slice(en);
          ed.selectionStart = ed.selectionEnd = s + t.length;
          save();
        }
      };
      ed.addEventListener("input", save);
      ed.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); return; }
        if (ex.lang !== "yaml") return;
        if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); insert("  "); return; }
        if (e.key === "Tab" && e.shiftKey){
          e.preventDefault();
          const s = ed.selectionStart, ls = ed.value.lastIndexOf("\n", s - 1) + 1;
          const n = ed.value.slice(ls, ls + 2).match(/^ {0,2}/)[0].length;
          if (n){ ed.value = ed.value.slice(0, ls) + ed.value.slice(ls + n); ed.selectionStart = ed.selectionEnd = Math.max(ls, s - n); save(); }
          return;
        }
        if (e.key === "Enter" && !e.shiftKey && !e.altKey){
          const before = ed.value.slice(0, ed.selectionStart);
          const line = before.slice(before.lastIndexOf("\n") + 1);
          let ind = line.match(/^ */)[0].length;
          const dm = line.slice(ind).match(/^(-\s+)+/);
          if (dm && /:/.test(line)) ind += dm[0].length;
          if (!/^\s*#/.test(line) && /(:|:\s*[|>][-+]?)\s*$/.test(line)) ind += 2;
          e.preventDefault();
          insert("\n" + " ".repeat(ind));
        }
      });
    }

    function clearMarks(){
      root.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong"));
    }

    function check(){
      const g = grade(ex, state[id]);
      // per-item coloring
      if (ex.type === "mc" || ex.type === "multi"){
        clearMarks();
        const sel = ex.type === "mc" ? (state[id] === null ? [] : [state[id]]) : state[id];
        sel.forEach(i => root.querySelector(`.opt[data-i="${i}"]`).classList.add(
          (ex.type === "mc" ? i === ex.answer : ex.answer.includes(i)) ? "right" : "wrong"));
      }
      if (ex.type === "order") root._draw(g.marks);
      if (ex.type === "match") root.querySelectorAll(".match tr").forEach((tr, i) => tr.className = g.marks[i] ? "right" : "wrong");
      if (ex.type === "fill") root.querySelectorAll(".fill input").forEach(inp => inp.className = g.marks[+inp.dataset.b] ? "right" : "wrong");
      if (ex.type === "lines") root.querySelectorAll(".ln").forEach(l => {
        const i = +l.dataset.i, sel = state[id].includes(i);
        l.className = "ln" + (sel ? (ex.answer.includes(i) ? " right" : " wrong") : "");
      });
      q(".results").innerHTML = g.results.map(r =>
        `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} ${esc(r.l)}${(r.sub || []).map(s => `<span class="sub">↳ ${esc(s)}</span>`).join("")}</li>`).join("") +
        (ex.type === "text" ? `<li class="${g.ok ? "pass" : "fail"}"><b>${g.results.filter(r => r.ok).length}/${g.results.length} checks passed${g.ok ? ". Nice work! 🎉" : ""}</b></li>` : "");
      if (g.ok){
        q(".why").style.display = "block";
        if (!done.includes(id)){ done.push(id); store.set("done", done); renderNav(); }
        root.classList.add("solved");
      }
    }

    q(".checkBtn").onclick = check;
    q(".hintBtn").onclick = () => { const h = q(".hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };
    q(".solBtn").onclick = e => {
      const s = q(".solution"), show = s.style.display !== "block";
      s.style.display = show ? "block" : "none";
      q(".why").style.display = show || root.classList.contains("solved") ? "block" : "none";
      e.target.textContent = show ? "Hide solution" : "Show solution";
    };
    q(".resetBtn").onclick = () => {
      if (ex.type === "text") store.set(draftKey, null);
      const fresh = document.createElement("section");
      root.replaceWith(fresh);
      buildExercise(ex, fresh);
    };
  }

  function buildExercise(ex, el){
    const n = ALL_EX.indexOf(ex) + 1;
    el.className = "exercise" + (done.includes(ex.id) ? " solved" : "");
    el.id = "ex-" + ex.id;
    el.innerHTML = `
      <h3>🧪 ${n}. ${ex.title} <span class="kind">${KIND[ex.type]}</span> <span class="badge">Completed</span></h3>
      <div>${ex.q}</div>
      ${bodyHtml(ex)}
      <div class="btns">
        <button class="btn primary checkBtn">Check my answer</button>
        <button class="btn hintBtn">Hint</button>
        <button class="btn solBtn">Show solution</button>
        <button class="btn resetBtn">Reset</button>
      </div>
      <div class="hint">💡 ${ex.hint}</div>
      <ul class="results"></ul>
      <div class="solution"><p class="solhead">Model answer</p>${solutionHtml(ex)}</div>
      <div class="why"><b>Why:</b> ${ex.why}</div>`;
    wireExercise(ex, el);
  }

  function renderModule(){
    const m = MODULES[current];
    const sections = m.sections.map(s => `
        <h3>${s.h}</h3>
        ${s.p ? `<p>${s.p}</p>` : ""}
        ${s.file ? `<div class="file">${s.file}</div>` : ""}
        ${s.code ? codeBlock(s.code, s.lang) : ""}
        ${s.after || ""}`).join("");

    $("#content").innerHTML = `
      <span class="tag">Module ${current + 1} of ${MODULES.length} · ${m.tag}</span>
      <h2>${m.title}</h2>
      <p class="lead">${m.intro}</p>
      ${sections}
      ${m.tip ? `<div class="note exam">🎯 <b>AZ-400 exam tip:</b> ${m.tip}</div>` : ""}
      <h3 style="margin-top:36px">Exercises (${m.exercises.length})</h3>
      <div id="exlist"></div>
      <div class="navfoot">
        <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="nextBtn" ${current === MODULES.length - 1 ? "disabled" : ""}>Next →</button>
      </div>`;
    const list = $("#exlist");
    m.exercises.forEach(ex => { const el = document.createElement("section"); list.appendChild(el); buildExercise(ex, el); });
    $("#prevBtn").onclick = () => go(current - 1);
    $("#nextBtn").onclick = () => go(current + 1);
    renderNav();
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0 || i >= MODULES.length) return;
    current = i; store.set("current", i);
    $("#side").classList.remove("open");
    renderModule();
  }

  $("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  document.addEventListener("click", e => {
    if (!e.target.classList.contains("copy")) return;
    const text = e.target.previousElementSibling.innerText;
    navigator.clipboard?.writeText(text).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); });
  });
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
  };
  $("#resetAllBtn").onclick = () => {
    if (!confirm("Reset all progress and saved drafts for this lab?")) return;
    done = []; store.set("done", done);
    ALL_EX.filter(e => e.type === "text").forEach(e => store.set("draft:" + e.id, null));
    renderModule();
  };
  const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t;

  renderModule();
}

if (typeof document !== "undefined" && document.getElementById("content")) startApp();
</script>
</body>
</html>
